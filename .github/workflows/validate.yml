name: docs-site validate

# Reusable workflow: product repos call this on PRs/pushes touching their
# docs/site subtree.
#
#   jobs:
#     docs:
#       uses: oxidean/docs-manifest/.github/workflows/validate.yml@v0.1.0
#       with:
#         dir: docs/site            # optional
#         cli-version: v0.1.0       # optional

on:
  workflow_call:
    inputs:
      dir:
        description: Docs subtree to validate (contains manifest.yaml)
        required: false
        default: docs/site
        type: string
      cli-version:
        description: docs-manifest release tag to install
        required: false
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: validate ${{ inputs.dir }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install docs-manifest
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          set -euo pipefail
          ver="${CLI_VERSION#v}"
          url="https://github.com/oxidean/docs-manifest/releases/download/${CLI_VERSION}/docs-manifest_${ver}_Linux_x86_64.tar.gz"
          curl -fsSL "$url" -o /tmp/docs-manifest.tar.gz
          tar -xzf /tmp/docs-manifest.tar.gz -C /tmp docs-manifest
          sudo install -m 0755 /tmp/docs-manifest /usr/local/bin/docs-manifest
          docs-manifest version

      - name: Validate
        run: docs-manifest validate "${{ inputs.dir }}"
