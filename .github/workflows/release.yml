name: docs-site release pack

# Reusable workflow: product repos call this on matching release tags (or
# via workflow_dispatch for the one-time bootstrap onto an existing
# release). Re-validates the subtree, hard-gates manifest.version against
# the tag, uploads docs-<version>.tar.gz + .sha256 to the release, then
# notifies the site repo so it can pin the new version.
#
#   jobs:
#     docs:
#       permissions:
#         contents: write   # release asset upload
#         issues: write     # dispatch-failure issue filing (optional — see below)
#       uses: oxidean/docs-manifest/.github/workflows/release.yml@v0.1.6
#       with:
#         tag: ${{ github.ref_name }}   # or dispatch input
#         dir: docs/site                # optional
#         cli-version: v0.1.6           # optional
#         product: oxl                  # optional; enables site dispatch
#         src-ref: main                 # optional; protected ref only (main/master or a release tag)
#         release-wait-minutes: 30      # optional; poll for the release
#       secrets:
#         site_dispatch_token: ${{ secrets.DOCS_SITE_DISPATCH_TOKEN }}
#
# The dispatch step is fail-soft: with no `product` input or no
# site_dispatch_token secret it skips with a notice, so a missing site
# config never breaks a product release. The token needs Actions:write
# on the site repo (see README). When dispatch does fail, the step also
# files a deduplicated issue in the calling repo so the failure surfaces
# beyond a log annotation — that leg needs the caller's `issues: write`
# grant and degrades to the warning alone without it.
#
# `src-ref` selects which ref supplies docs/site — the bundle still attaches
# to `tag` and version still derives from `tag`, so a tag that predates
# docs/site can be bootstrapped from a newer ref whose manifest already
# carries that version. `release-wait-minutes` bounds the pre-upload poll:
# when the GitHub Release is created by a different workflow (a binary
# matrix lane), the pack waits for it instead of failing the upload.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag the docs bundle attaches to (e.g. v0.4.0, ox-v0.4.2)
        required: true
        type: string
      version:
        description: Docs version override; default derives from tag by stripping the non-digit prefix
        required: false
        default: ""
        type: string
      dir:
        description: Docs subtree to pack
        required: false
        default: docs/site
        type: string
      cli-version:
        description: docs-manifest release tag to install
        required: false
        default: v0.1.6
        type: string
      src-ref:
        description: Ref checked out for docs/site content (default = tag); restricted to main/master or a release tag
        required: false
        default: ""
        type: string
      release-wait-minutes:
        description: Minutes to poll for the target GitHub Release before upload (0 = fail immediately if missing)
        required: false
        default: 30
        type: number
      product:
        description: Site product slug for dispatch (e.g. oxidean, ox-agent, oxl); empty = no dispatch
        required: false
        default: ""
        type: string
      site-repo:
        description: Repository that receives the docs-release dispatch
        required: false
        default: oxidean/oxidean.dev
        type: string
      site-workflow:
        description: workflow_dispatch file name in the site repo
        required: false
        default: docs-release.yml
        type: string
    secrets:
      site_dispatch_token:
        description: Token with Actions:write on the site repo (org secret DOCS_SITE_DISPATCH_TOKEN); empty = skip dispatch
        required: false

permissions:
  contents: write
  issues: write

jobs:
  pack:
    name: pack + attach docs bundle
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        env:
          TAG: ${{ inputs.tag }}
          SRC_REF: ${{ inputs.src-ref }}
          DIR: ${{ inputs.dir }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Dispatch-supplied inputs reach later run steps as text — refuse
          # anything that is not a plain ref/path token before it can.
          [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$TAG" =~ [0-9] ]] || { echo "::error::invalid tag input: $TAG"; exit 1; }
          # src-ref may only supply docs from a protected ref: the default
          # branch or a release tag. Anything else — fork PR refs like
          # pull/123/head, unprotected branches — could pack arbitrary
          # content into a release asset; the manifest gate checks the
          # version field, not content provenance.
          [[ -z "$SRC_REF" || "$SRC_REF" =~ ^(main|master|[A-Za-z-]*v?[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*)$ ]] || { echo "::error::src-ref must be main, master, or a release tag — fork PR refs cannot supply release docs"; exit 1; }
          [[ "$DIR" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ && "$DIR" != *..* ]] || { echo "::error::invalid dir input"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+[-.+A-Za-z0-9]*$ ]] || { echo "::error::invalid version input"; exit 1; }

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.src-ref != '' && inputs.src-ref || inputs.tag }}

      - name: Install docs-manifest
        env:
          CLI_VERSION: ${{ inputs.cli-version }}
        run: |
          set -euo pipefail
          ver="${CLI_VERSION#v}"
          url="https://github.com/oxidean/docs-manifest/releases/download/${CLI_VERSION}/docs-manifest_${ver}_linux_amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/docs-manifest.tar.gz
          tar -xzf /tmp/docs-manifest.tar.gz -C /tmp docs-manifest
          sudo install -m 0755 /tmp/docs-manifest /usr/local/bin/docs-manifest
          docs-manifest version

      - name: Resolve docs version
        id: docs
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Strip the longest non-digit prefix: ox-v0.4.2 -> 0.4.2, v0.1.7 -> 0.1.7.
          ver="${VERSION:-${TAG#"${TAG%%[0-9]*}"}}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Pack bundle
        env:
          DIR: ${{ inputs.dir }}
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
        run: docs-manifest pack "$DIR" --version "$DOCS_VERSION" --out "docs-${DOCS_VERSION}.tar.gz"

      # The Release may be created by a different workflow on the same tag
      # (e.g. a binary matrix lane that stages a draft and publishes later).
      # Poll until it exists AND is published: upload targets a real release,
      # and the site dispatch below fetches the bundle over the public
      # download URL, which 404s while the release is still a draft.
      - name: Wait for release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          WAIT_MINUTES: ${{ inputs.release-wait-minutes }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          until [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo true)" = "false" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::release $TAG was not published within ${WAIT_MINUTES}m — the docs bundle cannot attach"
              exit 1
            fi
            echo "waiting for release $TAG to be published ..."
            sleep 30
          done
          echo "release $TAG is published"

      - name: Attach to release ${{ inputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "docs-${DOCS_VERSION}.tar.gz" "docs-${DOCS_VERSION}.tar.gz.sha256" --clobber

      # Fail-soft: skips when no product input or no dispatch token, and a
      # dispatch failure never fails the release — the bundle is already
      # attached and docs:update can still discover it. A failed dispatch
      # does file one tracking issue per tag in the calling repo (the
      # caller's docs job needs issues:write for that to land — without it
      # the filing itself degrades to another warning).
      - name: Notify site repo
        env:
          DISPATCH_TOKEN: ${{ secrets.site_dispatch_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_REPO: ${{ inputs.site-repo }}
          SITE_WORKFLOW: ${{ inputs.site-workflow }}
          PRODUCT: ${{ inputs.product }}
          TAG: ${{ inputs.tag }}
          DOCS_VERSION: ${{ steps.docs.outputs.version }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$PRODUCT" ]; then
            echo "::notice::docs dispatch skipped — no 'product' input"
            exit 0
          fi
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::notice::docs dispatch skipped — site_dispatch_token not configured"
            exit 0
          fi
          if GH_TOKEN="$DISPATCH_TOKEN" gh workflow run "$SITE_WORKFLOW" -R "$SITE_REPO" \
            -f product="$PRODUCT" -f version="$DOCS_VERSION" \
            -f repo="$SOURCE_REPO" -f tag="$TAG"; then
            echo "dispatched $SITE_WORKFLOW to $SITE_REPO: $PRODUCT@$DOCS_VERSION ($SOURCE_REPO $TAG)"
          else
            echo "::warning::docs dispatch failed — bundle attached; site can still poll via docs:update"
            # Surface the failure where it is not a buried annotation:
            # one open issue per failed tag in the calling repo.
            title="docs dispatch failed: ${SOURCE_REPO}@${TAG}"
            if ! gh issue list -R "$SOURCE_REPO" --state open --limit 50 \
                --search "in:title \"docs dispatch failed\"" \
                --json title --jq '.[].title' | grep -Fxq "$title"; then
              body="The docs pack job attached \`docs-${DOCS_VERSION}.tar.gz\` to [\`${TAG}\`](${GITHUB_SERVER_URL}/${SOURCE_REPO}/releases/tag/${TAG}) but the \`workflow_dispatch\` to ${SITE_REPO} (\`${SITE_WORKFLOW}\`) failed — see [the run log](${GITHUB_SERVER_URL}/${SOURCE_REPO}/actions/runs/${GITHUB_RUN_ID}). The release itself is fine and the site still discovers the bundle via the docs:update poll; this tracks the dispatch gap (usually an expired or under-scoped DOCS_SITE_DISPATCH_TOKEN). Close once the dispatch has succeeded or the poll has ingested ${DOCS_VERSION}."
              gh issue create -R "$SOURCE_REPO" --title "$title" --body "$body" \
                || echo "::warning::could not file tracking issue — caller's docs job needs issues:write"
            else
              echo "open tracking issue already covers $TAG — not filing another"
            fi
          fi
